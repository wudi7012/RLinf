defaults:
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 5

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_sft_openvlaoft"
    logger_backends: ["tensorboard"]

  max_epochs: 10000
  max_steps: -1
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths: "/workspace/data/dataset"
  dataset_name: "libero_130_custom"
  custom_val_ratio: 0.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 8
  seed: 0

  model:
    model_path: "/workspace/data/model/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora"
    unnorm_key: libero_130_no_noops_trajall
    max_prompt_length: 128
    is_lora: True
    lora_rank: 32
    lora_path: null
    num_images_in_input: 1
    use_proprio: False

  optim:
    lr: 1.0e-4
    value_lr: 5.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 100
    total_training_steps: 10000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
