env_type: dataset_env
data_path: "/workspace/data/dataset/data"  # LeRobot parquet dataset

# Dataset format: "auto" (auto-detect), "parquet" (LeRobot), or "npy"
data_format: auto

# Map task_index to natural language prompts.
# DatasetEnv auto-discovers LeRobot meta/tasks.jsonl near `data_path`.
# `task_suite_name` is used only as a fallback for missing ids.
task_suite_name: libero_130
# Optional explicit mapping file (.json/.jsonl); highest priority.
task_index_to_description_path: null

# Target action convention for offline reward comparison.
# Set to "libero" to apply the same gripper post-processing as online Libero env.
wm_env_type: libero

# Reward configuration
reward_fn: mae  # mae / mse / exp_mae / cosine
reward_coef: 1.0

# Dataset keys (parquet default: actions, state, image)
action_key: actions        # key for ground-truth actions
state_key: state           # key for robot state
camera_name: image         # key for camera image
chunk_size: 8              # number of action steps per chunk (should match model's num_action_chunks)
frame_sample_stride: 10    # subsample starts: 0,10,20,... to reduce effective training samples

# Environment settings
total_num_envs: null
group_size: 8
auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 8  # = chunk_size (single chunk step per episode)
max_episode_steps: 8

use_rel_reward: False
seed: 0

video_cfg:
  save_video: False
  info_on_video: False
  video_base_dir: ${runner.logger.log_path}/video/train
