defaults:
  - env/libero_130@env.train
  - env/libero_130@env.eval
  - model/openvla_oft@actor.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_collect_base_vla_dataset"
    logger_backends: ["tensorboard"]

  only_eval: True
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

  collection:
    merge_shards: True
    shard_pattern: "collected_data_stage*_rank*"
    output_dataset_dir: ${runner.logger.log_path}/dagger_dataset
    preprocess_after_collection: True
    preprocessed_root: ${runner.collection.output_dataset_dir}/preprocessed
    preprocess_batch_size: 32
    overwrite_preprocessed: False

algorithm:
  rollout_epoch: 1
  eval_rollout_epoch: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  offline_rl:
    name: cql
    dataset:
      enable: False
      dataset_root: ${runner.collection.output_dataset_dir}
      chunk_size: ${actor.model.num_action_chunks}
      sample_stride: 1
      terminal_reward: 1.0
      intermediate_reward: 0.0
      base_do_sample: ${algorithm.sampling_params.do_sample}
      base_temperature: ${algorithm.sampling_params.temperature_eval}
      preprocess_batch_size: ${runner.collection.preprocess_batch_size}
      preprocessed_root: ${runner.collection.preprocessed_root}

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 8

  eval:
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    specific_reset_id: null
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/dagger_dataset_shards
      shard_per_worker: True
      export_format: "lerobot"
      only_success: False
      robot_type: "panda"
      fps: 10
      stats_sample_ratio: 0.1
      finalize_interval: 25

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 1234
  enable_offload: False

  model:
    model_path: "/path/to/model/RLinf-OpenVLAOFT-LIBERO-130-Base-Lora"
    model_type: "openvla_oft"
    unnorm_key: libero_130_no_noops_trajall
    proprio_dim: 8
    max_prompt_length: 128

reward:
  use_reward_model: False

critic:
  use_critic_model: False
