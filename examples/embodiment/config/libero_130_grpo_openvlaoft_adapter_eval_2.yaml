defaults:
  - env/libero_130@env.train
  - env/libero_130@env.eval
  - model/openvla_oft@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_130_grpo_openvlaoft_adapter_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: 25

  resume_dir: null
  ckpt_path: /inspire/hdd/project/chemicalreaction/zhutong-24049/wudi/RLinf/logs/20260414-06:37:29-libero_grpo_openvlaoft_adapter_offline/libero_grpo_openvlaoft_offline/checkpoints/global_step_150/actor/model_state_dict/full_weights.pt

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  rollout_epoch: 8
  eval_rollout_epoch: 2

  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level

  adv_type: grpo_per_action
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: True
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"

  # Required by rollout worker init even in eval-only mode (train_batch_size calc)
  train:
    total_num_envs: 512

  eval:
    total_num_envs: 32
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 2048
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/inspire/hdd/project/chemicalreaction/zhutong-24049/wudi/model/Rlinf-OpenVLAOFT-LIBERO-130-Base-Lora"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 8192
  seed: 1234
  enable_offload: False

  model:
    model_path: "/inspire/hdd/project/chemicalreaction/zhutong-24049/wudi/model/Rlinf-OpenVLAOFT-LIBERO-130-Base-Lora"
    model_type: "openvla_oft"
    unnorm_key: libero_130_no_noops_trajall
    proprio_dim: 8
    max_prompt_length: 128
    adapter: ${adapter}
    vla: ${vla}

  optim:
    lr: 2.0e-5
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

adapter:
  enable: True
  type: residual_chunk_adapter
  hidden_dim: 512
  num_layers: 3
  use_layernorm: true
  residual_bound: 0.5
  std_mode: global_learnable
  init_log_std: -2.0

vla:
  freeze_backbone: true
  freeze_action_head: true
  feature_type: pooled_last_hidden
  use_base_action: true
