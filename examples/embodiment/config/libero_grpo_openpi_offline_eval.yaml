defaults:
  - env/dataset_env_libero@env.train
  - env/dataset_env_libero@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_grpo_openpi_offline_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: 5

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl

  group_size: 8
  rollout_epoch: 4
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: -10.0
  rewards_upper_bound: 10.0

env:
  group_name: "EnvGroup"

  train:
    data_path: ${oc.env:RLINF_OFFLINE_DATA_PATH,/home/wudi/temp_data/dataset/data}
    total_num_envs: 32
    max_steps_per_rollout_epoch: 5
    max_episode_steps: 5
    reward_fn: mae
    reward_coef: ${algorithm.reward_coef}
    reward_action_mode: cumulative
    reward_granularity: chunk
    group_size: ${algorithm.group_size}
    chunk_size: 5
  eval:
    data_path: ${oc.env:RLINF_OFFLINE_DATA_PATH,/home/wudi/temp_data/dataset/data}
    total_num_envs: 8
    auto_reset: False
    ignore_terminations: False
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    reward_fn: mae
    reward_coef: ${algorithm.reward_coef}
    reward_action_mode: cumulative
    reward_granularity: chunk
    chunk_size: 5
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: False
      info_on_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${oc.env:RLINF_PI0_MODEL_PATH,/home/wudi/temp_data/model/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 42
  enable_offload: False

  model:
    model_path: ${oc.env:RLINF_PI0_MODEL_PATH,/home/wudi/temp_data/model/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT}
    num_action_chunks: 5

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
